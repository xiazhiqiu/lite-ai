<?xml version="1.0" encoding="UTF-8"?>
<!-- lite-ai mark — geometric "L" monogram for "lite".
     Bold stem + chamfered inner corner (slanted joint) gives a modern,
     forward-moving silhouette in the vein of the Pi agent. Deep-navy tile
     + cyan→violet gradient. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="lite-ai">
  <title>lite-ai</title>
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ad3ff"/>
      <stop offset="0.55" stop-color="#4f8bff"/>
      <stop offset="1" stop-color="#8a5cff"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="40" y="40" width="720" height="720" rx="150" fill="#0a1628"/>
  <!-- hairline ring to seat the mark on varied backgrounds -->
  <rect x="39.5" y="39.5" width="721" height="721" rx="150.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- "L": vertical stem, chamfered inner joint, horizontal foot -->
  <path fill="url(#lg)" d="M185 170 H315 V530 L565 530 V645 H185 Z"/>
</svg>